<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} - AgriMitra AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            href="{% url 'farmer_dashboard' %}"
            class="navbar-brand fw-bold"
        >
            🌱 AgriMitra AI
        </a>

        <a
            href="{% url 'logout_farmer' %}"
            class="btn btn-light"
        >
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">


                    <!-- TITLE -->

                    <h2 class="text-success mb-4">

                        🌾 {{ title }}

                    </h2>


                    <!-- ================= FORM ================= -->

                    <form method="POST">

                        {% csrf_token %}


                        <!-- FARM NAME -->

                        <div class="mb-3">

                            <label
                                for="farm_name"
                                class="form-label fw-bold"
                            >
                                Farm Name
                            </label>

                            <input
                                type="text"
                                id="farm_name"
                                name="farm_name"
                                class="form-control"
                                placeholder="Enter farm name"
                                value="{{ farm.farm_name|default:'' }}"
                                required
                            >

                        </div>


                        <!-- LOCATION -->

                        <div class="mb-3">

                            <label
                                for="location"
                                class="form-label fw-bold"
                            >
                                Farm Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                name="location"
                                class="form-control"
                                placeholder="Enter village / location"
                                value="{{ farm.location|default:'' }}"
                                required
                            >

                            <div class="form-text">
                                Example: Rajapur, Sangamner
                            </div>

                        </div>


                        <!-- AREA -->

                        <div class="mb-3">

                            <label
                                for="area"
                                class="form-label fw-bold"
                            >
                                Farm Area (acres)
                            </label>

                            <input
                                type="number"
                                id="area"
                                name="area"
                                class="form-control"
                                placeholder="Enter farm area"
                                step="0.01"
                                min="0.01"
                                value="{{ farm.area|default:'' }}"
                                required
                            >

                        </div>


                        <!-- SOIL TYPE -->

                        <div class="mb-3">

                            <label
                                for="soil_type"
                                class="form-label fw-bold"
                            >
                                Soil Type
                            </label>

                            <select
                                id="soil_type"
                                name="soil_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Select Soil Type --
                                </option>

                                <option
                                    value="Black Soil"
                                    {% if farm.soil_type == "Black Soil" %}
                                        selected
                                    {% endif %}
                                >
                                    Black Soil
                                </option>

                                <option
                                    value="Red Soil"
                                    {% if farm.soil_type == "Red Soil" %}
                                        selected
                                    {% endif %}
                                >
                                    Red Soil
                                </option>

                                <option
                                    value="Alluvial Soil"
                                    {% if farm.soil_type == "Alluvial Soil" %}
                                        selected
                                    {% endif %}
                                >
                                    Alluvial Soil
                                </option>

                                <option
                                    value="Laterite Soil"
                                    {% if farm.soil_type == "Laterite Soil" %}
                                        selected
                                    {% endif %}
                                >
                                    Laterite Soil
                                </option>

                                <option
                                    value="Sandy Soil"
                                    {% if farm.soil_type == "Sandy Soil" %}
                                        selected
                                    {% endif %}
                                >
                                    Sandy Soil
                                </option>

                                <option
                                    value="Loamy Soil"
                                    {% if farm.soil_type == "Loamy Soil" %}
                                        selected
                                    {% endif %}
                                >
                                    Loamy Soil
                                </option>

                            </select>

                        </div>


                        <!-- ================= BUTTONS ================= -->

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                💾 Save Farm
                            </button>


                            <a
                                href="{% url 'my_farms' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
