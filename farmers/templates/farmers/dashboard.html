<!DOCTYPE html>
<html>

<head>

    <title>Farmer Dashboard - AgriMitra AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <span class="navbar-brand">
            🌱 AgriMitra AI
        </span>

        <a
            href="{% url 'logout_farmer' %}"
            class="btn btn-light"
        >
            Logout
        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2>
        Welcome, {{ farmer.name }}! 👋
    </h2>

    <p>
        Welcome to your AgriMitra AI Farmer Dashboard.
    </p>

    <div class="row mt-4">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🌾 My Crops</h5>

                    <p>
                        Manage your crops and produce.
                    </p>

                    <button class="btn btn-success">
                        Manage Crops
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🤖 AI Prediction</h5>

                    <p>
                        Get AI-based farming predictions.
                    </p>

                    <button class="btn btn-primary">
                        Predict
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h5>📊 My Profile</h5>

                    <p>
                        Mobile: {{ farmer.mobile }}
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
