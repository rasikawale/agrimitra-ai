<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Crop - AgriMitra AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            href="{% url 'farmer_dashboard' %}"
            class="navbar-brand fw-bold"
        >
            🌱 AgriMitra AI
        </a>

        <a
            href="{% url 'logout_farmer' %}"
            class="btn btn-light"
        >
            Logout
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4 text-center">

                    <div style="font-size: 55px;">
                        ⚠️
                    </div>

                    <h2 class="text-danger">
                        Delete Crop?
                    </h2>

                    <p class="mt-3">
                        Are you sure you want to delete
                        <strong>
                            {{ crop.crop_name }}
                        </strong>
                        ?
                    </p>


                    <div class="alert alert-warning text-start">

                        <p class="mb-1">
                            🌾
                            <strong>Farm:</strong>
                            {{ crop.farm.farm_name }}
                        </p>

                        <p class="mb-1">
                            📍
                            <strong>Location:</strong>
                            {{ crop.farm.location }}
                        </p>

                        <p class="mb-1">
                            📐
                            <strong>Area:</strong>
                            {{ crop.area }} acres
                        </p>

                        <p class="mb-0">
                            🌿
                            <strong>Stage:</strong>
                            {{ crop.crop_stage }}
                        </p>

                    </div>


                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            🗑️ Yes, Delete Crop
                        </button>

                        <a
                            href="{% url 'my_crops' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
