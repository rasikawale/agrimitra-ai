<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Farm - AgriMitra AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            href="{% url 'farmer_dashboard' %}"
            class="navbar-brand fw-bold"
        >
            🌱 AgriMitra AI
        </a>

        <a
            href="{% url 'logout_farmer' %}"
            class="btn btn-light"
        >
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body text-center">


                    <h2 class="text-danger mb-4">

                        🗑️ Delete Farm

                    </h2>


                    <p class="fs-5">

                        Are you sure you want to delete this farm?

                    </p>


                    <div class="alert alert-warning">

                        <strong>
                            {{ farm.farm_name }}
                        </strong>

                        <br>

                        📍 {{ farm.location }}

                        <br>

                        📐 {{ farm.area }} acres

                        <br>

                        🌱 {{ farm.soil_type }}

                    </div>


                    <p class="text-muted">

                        This action cannot be undone.

                    </p>


                    <!-- DELETE FORM -->

                    <form method="POST">

                        {% csrf_token %}


                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            🗑️ Yes, Delete Farm
                        </button>


                        <a
                            href="{% url 'my_farms' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
