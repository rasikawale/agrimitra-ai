<!DOCTYPE html>
<html>
<head>
    <title>Farmer Registration - AgriMitra AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        🌱 Farmer Registration
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Farmer Name</label>
                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label>Mobile Number</label>
                            <input
                                type="text"
                                name="mobile"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label>Username</label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                            >
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >
                        </div>

                        <button class="btn btn-success w-100">
                            Register
                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Already registered?
                        <a href="{% url 'login_farmer' %}">
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
