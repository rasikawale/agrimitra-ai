<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} - AgriMitra AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            href="{% url 'farmer_dashboard' %}"
            class="navbar-brand fw-bold"
        >
            🌱 AgriMitra AI
        </a>

        <a
            href="{% url 'logout_farmer' %}"
            class="btn btn-light"
        >
            Logout
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-success mb-4">
                        🌱 Add Crop
                    </h2>

                    <p class="text-muted">
                        Add the crop that you are growing
                        on your farm.
                    </p>


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-danger">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <!-- FARM -->

                        <div class="mb-3">

                            <label class="form-label">
                                🌾 Select Farm
                            </label>

                            <select
                                name="farm"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Select Farm --
                                </option>

                                {% for farm in farms %}

                                    <option
                                        value="{{ farm.id }}"
                                    >
                                        {{ farm.farm_name }}
                                        -
                                        {{ farm.location }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- CROP NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                🌱 Crop Name
                            </label>

                            <input
                                type="text"
                                name="crop_name"
                                class="form-control"
                                placeholder="Example: Wheat"
                                required
                            >

                        </div>


                        <!-- VARIETY -->

                        <div class="mb-3">

                            <label class="form-label">
                                🌾 Crop Variety
                            </label>

                            <input
                                type="text"
                                name="variety"
                                class="form-control"
                                placeholder="Example: Lokwan"
                            >

                        </div>


                        <!-- AREA -->

                        <div class="mb-3">

                            <label class="form-label">
                                📐 Area Under Crop (Acres)
                            </label>

                            <input
                                type="number"
                                name="area"
                                class="form-control"
                                step="0.01"
                                min="0"
                                placeholder="Example: 2.5"
                                required
                            >

                        </div>


                        <!-- SOWING DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                📅 Sowing Date
                            </label>

                            <input
                                type="date"
                                name="sowing_date"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- HARVEST DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                🗓️ Expected Harvest Date
                            </label>

                            <input
                                type="date"
                                name="expected_harvest_date"
                                class="form-control"
                            >

                        </div>


                        <!-- IRRIGATION -->

                        <div class="mb-3">

                            <label class="form-label">
                                💧 Irrigation Type
                            </label>

                            <select
                                name="irrigation_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Select Irrigation Type --
                                </option>

                                <option value="Rainfed">
                                    Rainfed
                                </option>

                                <option value="Drip">
                                    Drip
                                </option>

                                <option value="Sprinkler">
                                    Sprinkler
                                </option>

                                <option value="Flood">
                                    Flood Irrigation
                                </option>

                            </select>

                        </div>


                        <!-- CROP STAGE -->

                        <div class="mb-4">

                            <label class="form-label">
                                🌿 Current Crop Stage
                            </label>

                            <select
                                name="crop_stage"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Select Crop Stage --
                                </option>

                                <option value="Seedling">
                                    Seedling
                                </option>

                                <option value="Vegetative">
                                    Vegetative
                                </option>

                                <option value="Flowering">
                                    Flowering
                                </option>

                                <option value="Fruiting">
                                    Fruiting
                                </option>

                                <option value="Harvesting">
                                    Harvesting
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            🌱 Add Crop
                        </button>

                        <a
                            href="{% url 'my_crops' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
